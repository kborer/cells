name: Endurance
on:
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: endurance
  cancel-in-progress: false
jobs:
  endurance:
    name: Endurance / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: mixed-resize, scene: mixed, seed: 42, size: 120x40, magnification: normal, style: classic, steps: 108000, fixed: ''}
          - {profile: blood-resize, scene: blood, seed: 42, size: 120x40, magnification: normal, style: classic, steps: 108000, fixed: ''}
          - {profile: microbial-resize, scene: microbial, seed: 42, size: 120x40, magnification: normal, style: classic, steps: 108000, fixed: ''}
          - {profile: vessel-resize, scene: vessel, seed: 42, size: 120x40, magnification: normal, style: classic, steps: 108000, fixed: ''}
          - {profile: compact-seed0, scene: mixed, seed: 0, size: 80x24, magnification: normal, style: classic, steps: 27000, fixed: '--fixed-size'}
          - {profile: compact-seed42, scene: mixed, seed: 42, size: 80x24, magnification: normal, style: classic, steps: 27000, fixed: '--fixed-size'}
          - {profile: overview, scene: mixed, seed: 0, size: 80x24, magnification: overview, style: classic, steps: 27000, fixed: '--fixed-size'}
          - {profile: raster-detail, scene: mixed, seed: 42, size: 80x24, magnification: detail, style: raster, steps: 27000, fixed: '--fixed-size'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - name: Extended generated lifecycle and interaction sequences
        env:
          CELLS_EXTENDED_TESTS: '1'
        run: python -m unittest discover -s tests -p test_properties.py -v
      - name: Check memory, latency, lifecycle progress, and diversity
        env:
          SCENE: ${{ matrix.scene }}
          SEED: ${{ matrix.seed }}
          SIZE: ${{ matrix.size }}
          MAGNIFICATION: ${{ matrix.magnification }}
          STYLE: ${{ matrix.style }}
          STEPS: ${{ matrix.steps }}
          FIXED: ${{ matrix.fixed }}
        run: |
          fixed_args=()
          if [[ -n "$FIXED" ]]; then fixed_args+=(--fixed-size); fi
          python tools/endurance.py --steps "$STEPS" --scene "$SCENE" --seed "$SEED" --size "$SIZE" --magnification "$MAGNIFICATION" --style "$STYLE" "${fixed_args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: endurance-${{ matrix.profile }}
          path: endurance.json
          if-no-files-found: warn
