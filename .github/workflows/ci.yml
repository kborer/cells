name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install "hypothesis>=6.168.5" "ruff==0.17.6" "coverage>=7.16.2"
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Run simulation, CLI, and pseudo-terminal tests
        run: |
          python -m coverage run --branch --source terminal_cells -m unittest discover -s tests -v
          python -m coverage report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        with:
          name: coverage
          path: .coverage
          include-hidden-files: true
      - name: Install package build tools
        run: python -m pip install build "setuptools>=77" wheel
      - name: Build a wheel on this platform
        run: python -m build --wheel --outdir "${{ runner.temp }}/cells-wheel"
      - name: Check an isolated installed wheel outside the checkout
        run: python tools/check_dist.py --wheel-only --dist "${{ runner.temp }}/cells-wheel"

  distributions:
    name: Build and verify distributions
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -r requirements-build.txt
      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: python -m build --no-isolation
      - run: python tools/check_reproducible.py
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Test source archive and isolated installed wheels
        run: python tools/check_dist.py
      - name: Generate the release manifest
        run: python tools/release.py manifest --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-manifest
          path: release-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
