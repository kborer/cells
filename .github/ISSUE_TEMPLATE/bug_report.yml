name: Bug report
description: Report an animation, simulation, installation, or terminal problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: If available, include cells --diagnostics output, your terminal app, and its light or dark background. Unknown details are fine.
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: If known, include the command, seed, approximate time, and any resize or key input. Screenshots or recordings help; occasional events are welcome even without reliable reproduction.
    validations:
      required: false
