name: Ubuntu packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ppa_key_fingerprint:
        description: Expected cells PPA repository signing fingerprint (optional)
        type: string
        required: false

permissions:
  contents: read

jobs:
  deb:
    name: Ubuntu ${{ matrix.ubuntu }} package
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ubuntu: '24.04', series: noble}
          - {ubuntu: '26.04', series: resolute}
    steps:
      - name: Install distro build and test tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools python3-wheel python3-hypothesis lintian
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build from the verified 0.1.0 upstream release
        env:
          UBUNTU_SERIES: ${{ matrix.series }}
        run: |
          mkdir -p /tmp/cells-deb
          cd /tmp/cells-deb
          curl --fail --location --retry 3 \
            https://github.com/kborer/cells/releases/download/v0.1.0/terminal_cells-0.1.0.tar.gz \
            -o terminal-cells_0.1.0.orig.tar.gz
          echo 'b6ff320183c096f5126dca827143d0daed9d7613baaac54c147b2575645bcf46  terminal-cells_0.1.0.orig.tar.gz' | sha256sum --check
          tar -xzf terminal-cells_0.1.0.orig.tar.gz
          cp -a "$GITHUB_WORKSPACE/debian" terminal_cells-0.1.0/debian
          cd terminal_cells-0.1.0
          sed -i "1s/0.1.0-1) unstable/0.1.0-1~${UBUNTU_SERIES}1) ${UBUNTU_SERIES}/" debian/changelog
          dpkg-buildpackage --no-sign -sa
      - name: Check package policy
        run: lintian --allow-root --fail-on error /tmp/cells-deb/*.changes
      - name: Test install, reinstall, and removal
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Minimal Ubuntu images discard manuals unless this filter is removed.
          find /etc/dpkg/dpkg.cfg.d -type f -exec \
            sed -i '\|^path-exclude[= ]*/usr/share/man/|d' {} +
          apt-get install -y /tmp/cells-deb/terminal-cells_*_all.deb
          sh -x debian/tests/smoke
          apt-get install -y --reinstall /tmp/cells-deb/terminal-cells_*_all.deb
          sh -x debian/tests/smoke
          apt-get purge -y terminal-cells
          if command -v cells; then
            echo 'cells executable survived package removal' >&2
            exit 1
          fi
      - name: Collect archives and checksums
        if: always()
        run: |
          mkdir -p packages
          cp /tmp/cells-deb/*.deb /tmp/cells-deb/*.dsc /tmp/cells-deb/*.tar.* \
            /tmp/cells-deb/*.changes /tmp/cells-deb/*.buildinfo packages/
          cd packages
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ubuntu-${{ matrix.ubuntu }}-packages
          path: packages/
          if-no-files-found: error

  ppa-install:
    name: PPA install / Ubuntu ${{ matrix.ubuntu }}
    if: github.event_name == 'workflow_dispatch' && inputs.ppa_key_fingerprint != ''
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ubuntu: '24.04', series: noble, version: '0.1.0-1ppa1~24.04.1'}
          - {ubuntu: '26.04', series: resolute, version: '0.1.0-1ppa1~26.04.1'}
    env:
      DEBIAN_FRONTEND: noninteractive
      PPA_KEY: ${{ inputs.ppa_key_fingerprint }}
      UBUNTU_SERIES: ${{ matrix.series }}
      EXPECTED_VERSION: ${{ matrix.version }}
    steps:
      - name: Install apt verification tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg python3
      - name: Verify the PPA key and configure its apt source
        run: |
          case "$PPA_KEY" in
            *[!0-9A-Fa-f]*|'') echo 'Invalid fingerprint' >&2; exit 1 ;;
          esac
          test "${#PPA_KEY}" -eq 40
          curl --fail --location --retry 3 \
            "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$PPA_KEY" \
            -o /tmp/cells-ppa.asc
          actual=$(gpg --batch --with-colons --show-keys /tmp/cells-ppa.asc | \
            awk -F: '$1 == "fpr" { print $10; exit }')
          test "$actual" = "$(printf '%s' "$PPA_KEY" | tr '[:lower:]' '[:upper:]')"
          gpg --batch --dearmor --output /usr/share/keyrings/cells-ppa.gpg /tmp/cells-ppa.asc
          echo "deb [signed-by=/usr/share/keyrings/cells-ppa.gpg] https://ppa.launchpadcontent.net/bogobogosort/cells/ubuntu $UBUNTU_SERIES main" \
            > /etc/apt/sources.list.d/cells.list
          find /etc/dpkg/dpkg.cfg.d -type f -exec \
            sed -i '\|^path-exclude[= ]*/usr/share/man/|d' {} +
      - name: Install and exercise the published PPA package
        run: |
          apt-get update
          apt-cache policy terminal-cells
          apt-get install -y "terminal-cells=$EXPECTED_VERSION"
          test "$(dpkg-query -W -f='${Version}' terminal-cells)" = "$EXPECTED_VERSION"
          cd /tmp
          test "$(cells --version)" = 'cells 0.1.0'
          cells --snapshot --seed 42 --size 80x24 > cells-snapshot
          python3 - <<'PYTHON'
          from pathlib import Path
          text = Path('cells-snapshot').read_text()
          assert len(text.splitlines()) == 24 and text.strip()
          import terminal_cells
          assert terminal_cells.__file__.startswith('/usr/lib/python3/dist-packages/')
          PYTHON
          test -f /usr/share/man/man1/cells.1.gz
          apt-get purge -y terminal-cells
          if command -v cells; then exit 1; fi
